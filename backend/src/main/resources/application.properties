spring.application.name=hotel-revenue-management

server.port=8080

# ==========================================
# MySQL Database
# ==========================================

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hotel_revenue_management}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD:root}

# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# ==========================================
# SQL Initialization
# ==========================================

spring.sql.init.mode=never

# ==========================================
# Application
# ==========================================

spring.main.banner-mode=off